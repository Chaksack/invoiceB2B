    get:
      consumes:
      - application/json
      description: Get a paginated list of all activity logs with optional filters
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 20)'
        in: query
        name: pageSize
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by staff ID
        in: query
        name: staff_id
        type: string
      - description: Filter by action type
        in: query
        name: action
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ActivityLogListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get activity logs
      tags:
      - admin-logs
  /admin/dashboard/analytics:
    get:
      consumes:
      - application/json
      description: Get aggregated data for the admin dashboard (users, invoices, transactions)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.AdminDashboardAnalytics'
