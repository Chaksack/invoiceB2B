      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10)'
        in: query
        name: pageSize
        type: integer
      - description: Filter by name
        in: query
        name: name
        type: string
      - description: Filter by code
        in: query
        name: code
        type: string
      - description: Filter by active status (true/false)
        in: query
        name: is_active
