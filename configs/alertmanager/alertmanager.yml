global:
  # SMTP configuration for email alerts - Production ready with secrets
  smtp_smarthost: '${MONITORING_SMTP_HOST}:${MONITORING_SMTP_PORT}'
  smtp_from: '${MONITORING_FROM_EMAIL}'
  smtp_auth_username: '${MONITORING_SMTP_USER}'
  smtp_auth_password: '${MONITORING_SMTP_PASSWORD}'
  smtp_require_tls: true
  smtp_hello: 'alertmanager.invoiceb2b.com'

# Templates for alert formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# The route defines how alerts are routed to different receivers
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
  # Critical alerts go to both Slack and email immediately
  - match:
      severity: critical
    receiver: 'critical-alerts'
    group_wait: 0s
    repeat_interval: 1h
  
  # Warning alerts go to Slack only
  - match:
      severity: warning
    receiver: 'warning-alerts'
    group_wait: 30s
    repeat_interval: 4h

  # Database specific alerts
  - match:
      service: database
    receiver: 'database-alerts'
    group_wait: 5s
    repeat_interval: 2h

  # Application specific alerts
  - match:
      service: invoiceb2b
    receiver: 'app-alerts'
    group_wait: 15s
    repeat_interval: 2h

# Receivers define where alerts are sent
receivers:
- name: 'default-receiver'
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'  # Should be set via environment variable or secrets manager
    channel: '#alerts'
    username: 'AlertManager'
    icon_emoji: ':warning:'
    title: 'InvoiceB2B Alert'
    text: |
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Severity: {{ .Labels.severity }}
      {{ end }}

- name: 'critical-alerts'
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#critical-alerts'
    username: 'AlertManager'
    icon_emoji: ':rotating_light:'
    title: 'CRITICAL: InvoiceB2B Alert'
    text: |
      🚨 CRITICAL ALERT 🚨
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Service: {{ .Labels.service }}
      Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
      {{ end }}
    send_resolved: true
  
  email_configs:
  - to: 'admin@invoiceb2b.com,ops-team@invoiceb2b.com'
    subject: 'CRITICAL Alert: {{ .GroupLabels.alertname }}'
    html: |
      <h2>🚨 CRITICAL ALERT</h2>
      <table>
      {{ range .Alerts }}
      <tr>
        <td><strong>Alert:</strong></td>
        <td>{{ .Annotations.summary }}</td>
      </tr>
      <tr>
        <td><strong>Description:</strong></td>
        <td>{{ .Annotations.description }}</td>
      </tr>
      <tr>
        <td><strong>Service:</strong></td>
        <td>{{ .Labels.service }}</td>
      </tr>
      <tr>
        <td><strong>Severity:</strong></td>
        <td>{{ .Labels.severity }}</td>
      </tr>
      <tr>
        <td><strong>Time:</strong></td>
        <td>{{ .StartsAt.Format "2006-01-02 15:04:05" }}</td>
      </tr>
      {{ end }}
      </table>
    send_resolved: true

- name: 'warning-alerts'
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#monitoring'
    username: 'AlertManager'
    icon_emoji: ':warning:'
    title: 'Warning: InvoiceB2B Alert'
    text: |
      ⚠️ WARNING
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Service: {{ .Labels.service }}
      {{ end }}
    send_resolved: true

- name: 'database-alerts'
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#database-alerts'
    username: 'AlertManager'
    icon_emoji: ':database:'
    title: 'Database Alert: InvoiceB2B'
    text: |
      🗄️ DATABASE ALERT
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Severity: {{ .Labels.severity }}
      {{ end }}
  
  email_configs:
  - to: 'dba@invoiceb2b.com,admin@invoiceb2b.com'
    subject: 'Database Alert: {{ .GroupLabels.alertname }}'
    html: |
      <h2>🗄️ Database Alert</h2>
      {{ range .Alerts }}
      <p><strong>Alert:</strong> {{ .Annotations.summary }}</p>
      <p><strong>Description:</strong> {{ .Annotations.description }}</p>
      <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
      <p><strong>Time:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
      {{ end }}
    send_resolved: true

- name: 'app-alerts'
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#app-alerts'
    username: 'AlertManager'
    icon_emoji: ':computer:'
    title: 'Application Alert: InvoiceB2B'
    text: |
      💻 APPLICATION ALERT
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Severity: {{ .Labels.severity }}
      {{ end }}
    send_resolved: true

# Inhibit rules to prevent alert spam
inhibit_rules:
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: ['alertname', 'instance']