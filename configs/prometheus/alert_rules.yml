groups:
- name: invoiceb2b_alerts
  rules:
  # Application availability alerts
  - alert: ApplicationDown
    expr: up{job="invoiceb2b-app"} == 0
    for: 1m
    labels:
      severity: critical
      service: invoiceb2b
    annotations:
      summary: "InvoiceB2B application is down"
      description: "InvoiceB2B application has been down for more than 1 minute."

  # High CPU usage alert
  - alert: HighCPUUsage
    expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
    for: 5m
    labels:
      severity: warning
      service: system
    annotations:
      summary: "High CPU usage detected"
      description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}."

  # High memory usage alert
  - alert: HighMemoryUsage
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
    for: 5m
    labels:
      severity: warning
      service: system
    annotations:
      summary: "High memory usage detected"
      description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}."

  # Database connection issues
  - alert: DatabaseConnectionError
    expr: increase(database_connection_errors_total[5m]) > 5
    for: 2m
    labels:
      severity: critical
      service: database
    annotations:
      summary: "Database connection errors detected"
      description: "More than 5 database connection errors in the last 5 minutes."

  # High HTTP error rate
  - alert: HighHTTPErrorRate
    expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) * 100 > 5
    for: 3m
    labels:
      severity: warning
      service: invoiceb2b
    annotations:
      summary: "High HTTP error rate"
      description: "HTTP error rate is above 5% for more than 3 minutes."

  # Response time alert
  - alert: HighResponseTime
    expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
    for: 5m
    labels:
      severity: warning
      service: invoiceb2b
    annotations:
      summary: "High response time detected"
      description: "95th percentile response time is above 2 seconds for more than 5 minutes."

  # Disk space alert
  - alert: DiskSpaceLow
    expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
    for: 5m
    labels:
      severity: warning
      service: system
    annotations:
      summary: "Disk space running low"
      description: "Disk space usage is above 85% on {{ $labels.instance }} mount {{ $labels.mountpoint }}."

  # ECS service alerts
  - alert: ECSServiceDown
    expr: aws_ecs_service_running_count < aws_ecs_service_desired_count
    for: 2m
    labels:
      severity: critical
      service: ecs
    annotations:
      summary: "ECS service running count below desired"
      description: "ECS service {{ $labels.service_name }} has {{ $value }} running tasks but desires {{ $labels.desired_count }}."